[gcode_macro LOAD_FILAMENT]
description: 擦料后进喷嘴。仅当 UNLOAD 保存过打印位置时才恢复
gcode:
    {% set reason = params.REASON|default("load")|lower %}
    G90
    G1 Y288 F8000
    G1 X288 Y288 F8000
    G1 Z1 F1000
    G1 E50.0 F300
    G1 E50.0 F300
    G1 E50.0 F300
    G1 E50.0 F300
    G1 X240 Y288 F5000
    G1 X288 Y288 F5000
    G1 Z10 F1000
    {% set saved = printer["gcode_macro UNLOAD_FILAMENT"].saved_pos|int %}
    {% if reason in ["toolchange", "refill"] and saved %}
        RESTORE_GCODE_STATE NAME=BMCU_PRINT_POS MOVE=1 MOVE_SPEED=1000
        SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=saved_pos VALUE=0
    {% endif %}

[gcode_macro BMCU_TOOLHEAD_PREPARE]
description: BMCU 把料送到挤出头后，打印机接管并进喷嘴
gcode:
    {% set material = params.MATERIAL|default("") %}
    {% set reason = params.REASON|default("load") %}
    {action_respond_info("BMCU_TOOLHEAD_PREPARE material=%s reason=%s" % (material, reason))}
    LOAD_FILAMENT MATERIAL={material} REASON={reason}

[gcode_macro UNLOAD_FILAMENT]
description: PHASE=cut 只切刀；PHASE=retract 只挤出回抽
variable_saved_pos: 0
gcode:
    {% set reason = params.REASON|default("unload")|lower %}
    {% set phase = params.PHASE|default("all")|lower %}
    {% set pin_x = 40.0 %}
    {% set pin_y = 57.0 %}
    {% set cut_x = 9.2 %}
    {% set cut_y = 57.0 %}
    {% set z_hop = 10.0 %}
    {% set travel_speed = 3000 %}
    {% set cut_speed = 500 %}
    {% set sync_mm = 49.0 %}
    {% set sync_speed = 1800 %}
    {% if phase in ["cut", "all"] %}
        {action_respond_info("UNLOAD_FILAMENT phase=cut")}
        SAVE_GCODE_STATE NAME=BMCU_PRINT_POS
        SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=saved_pos VALUE=1
        G90
        G91
        G1 Z{z_hop} F600
        G90
        G1 X{pin_x} Y{pin_y} F{travel_speed}
        G1 X{cut_x} Y{cut_y} F{cut_speed}
        M400
        G4 P1000
        G1 X{pin_x} Y{pin_y} F{travel_speed}
        M400
    {% endif %}
    {% if phase in ["retract", "all"] %}
        {action_respond_info("UNLOAD_FILAMENT phase=retract")}
        {% if printer["gcode_macro UNLOAD_FILAMENT"].saved_pos|int == 0 %}
            SAVE_GCODE_STATE NAME=BMCU_PRINT_POS
            SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=saved_pos VALUE=1
        {% endif %}
        M83
        G1 E-{sync_mm} F{sync_speed}
        G1 E-{sync_mm} F{sync_speed}
        G1 E-{sync_mm} F{sync_speed}
        G1 E-{sync_mm} F{sync_speed}
        M82
        M400
        {% if reason != "toolchange" %}
            {% if phase == "all" or printer["gcode_macro UNLOAD_FILAMENT"].saved_pos|int %}
                RESTORE_GCODE_STATE NAME=BMCU_PRINT_POS MOVE=1 MOVE_SPEED=1000
                SET_GCODE_VARIABLE MACRO=UNLOAD_FILAMENT VARIABLE=saved_pos VALUE=0
            {% endif %}
        {% endif %}
        {action_respond_info("UNLOAD_FILAMENT sync retract finished")}
    {% endif %}

[gcode_macro BMCU_BEFORE_PULLBACK]
description: 换料时先切刀再挤出回抽；面板 Unload 已切过则只回抽
gcode:
    {% set material = params.MATERIAL|default("") %}
    {% set reason = params.REASON|default("unload") %}
    {% set reason_l = reason|lower %}
    {action_respond_info("BMCU_BEFORE_PULLBACK material=%s reason=%s" % (material, reason))}
    {% if reason_l in ["toolchange", "refill"] %}
        UNLOAD_FILAMENT PHASE=cut MATERIAL={material} REASON={reason}
    {% endif %}
    UNLOAD_FILAMENT PHASE=retract MATERIAL={material} REASON={reason}

[gcode_macro BMCU_UNLOAD]
description: 先停通道切刀，再交给原版 BMCU_UNLOAD 做同步回抽
rename_existing: _BMCU_UNLOAD
gcode:
    {% set material = params.MATERIAL|default("") %}
    {% set reason = params.REASON|default("unload") %}
    {% set device = params.DEVICE|default("bmcu0") %}
    {% set channel = params.CHANNEL|default("0") %}
    {action_respond_info("BMCU_UNLOAD cut then _BMCU_UNLOAD device=%s channel=%s" % (device, channel))}
    BMCU_STOP
    G4 P300
    UNLOAD_FILAMENT PHASE=cut MATERIAL={material} REASON={reason}
    _BMCU_UNLOAD DEVICE={device} CHANNEL={channel}
    BMCU_STOP
